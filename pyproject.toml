[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ipynb-scrubber"
description = "Generate exercise versions of Jupyter notebooks"
readme = "README.md"
authors = [
    {name = "Jarrett Keifer", email = "jkeifer0@gmail.com"},
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["jupyter", "notebook", "ipynb", "teaching", "exercise", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Pre-processors",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0.3",
]
dynamic = ["version"]

[project.scripts]
ipynb-scrubber = "ipynb_scrubber.cli:cli"

[project.urls]
Repository = 'https://github.com/jkeifer/ipynb-scrubber'
Issues = 'https://github.com/jkeifer/ipynb-scrubber/issues'

[dependency-groups]
dev = [
    "jupytext>=1.16",
    "mypy>=1.17",
    "nbformat>=5.11.0",
    "prek>=0.4.13",
    "pre-commit-hooks>=5.0",
    "pytest>=8.3",
    "pytest-cov>=6.1",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ipynb_scrubber/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ipynb_scrubber"]

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    'B',
    'BLE',
    'C4',
    'C90',
    'COM',
    'DTZ',
    'E',
    'ERA',
    'F',
    'FA',
    'G',
    'I',
    'INP',
    'N',
    'NPY',
    'PT',
    'PTH',
    'RET',
    'RUF',
    'S',
    'SIM',
    'T20',
    'UP',
    'W',

]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['E402']
'tests/**/*' = ['T201', 'S101', 'S603']

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.mypy]
ignore_missing_imports = true
scripts_are_modules = true
strict = true

[[tool.mypy.overrides]]
module = 'tests.*'
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
check_untyped_defs = false
strict_equality = false
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts="--cov=ipynb_scrubber"

[tool.coverage.run]
patch = ['subprocess']

[tool.coverage.report]
show_missing = true
skip_empty = true
sort = "Cover"
